apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicflow-devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinicflow
      pipeline: task9
  template:
    metadata:
      labels:
        app: clinicflow
        pipeline: task9
    spec:
      containers:
        - name: clinicflow
          image: clinicflow:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clinicflow-devsecops
spec:
  type: NodePort
  selector:
    app: clinicflow
    pipeline: task9
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085
