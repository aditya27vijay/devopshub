apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicflow-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinicflow-bluegreen
      version: blue
  template:
    metadata:
      labels:
        app: clinicflow-bluegreen
        version: blue
    spec:
      containers:
        - name: clinicflow
          image: clinicflow-blue:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clinicflow-bluegreen
spec:
  type: NodePort
  selector:
    app: clinicflow-bluegreen
    version: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
