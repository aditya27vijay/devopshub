apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicflow-task7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinicflow
      pipeline: task7
  template:
    metadata:
      labels:
        app: clinicflow
        pipeline: task7
    spec:
      containers:
        - name: clinicflow
          image: clinicflow:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: clinicflow-task7
spec:
  type: NodePort
  selector:
    app: clinicflow
    pipeline: task7
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
